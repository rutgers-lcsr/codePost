#
# codePost — Self-Hosted Docker Compose
#
# Builds images from source using the sibling codePost-api and codePost-ui repos.
#
# Usage:
#   1. Clone codePost-api and codePost-ui as sibling directories
#   2. Copy .env.example to .env and fill in your values (or run install.sh)
#   3. Place SSL certs in ./certs/ (fullchain.pem + privkey.pem) or use Certbot
#   4. docker compose up -d --build

services:
  # ─── Reverse Proxy ───────────────────────────────────────────────────
  proxy:
    image: nginx:latest
    container_name: codepost-proxy
    environment:
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME:-localhost}
    volumes:
      - ./deploy/proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/ssl/certs:ro
      - certbot-webroot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── API Server ─────────────────────────────────────────────────────
  api:
    container_name: codepost-api
    build:
      context: ../codePost-api
      target: api
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG:-FALSE}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY}
      - CELERY_BROKER_URL=redis://redis:6379
      - AUTOGRADER_AUTO_EXECUTE=${AUTOGRADER_AUTO_EXECUTE:-true}
      - API_URL=${API_URL}
      - CLIENT_URL=${CLIENT_URL}
      - DB_NAME=${DB_NAME:-codepost}
      - DB_HOSTNAME=database
      - DB_PORT=3306
      - DB_USERNAME=${DB_USERNAME:-codepost_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - API_USER=${API_USER}
      - API_PASSWORD=${API_PASSWORD}
      - EMAIL_HOST=${EMAIL_HOST:-localhost}
      - DEFAULT_EMAIL_FROM=${DEFAULT_EMAIL_FROM:-no-reply@localhost}
      - SUPPORT_URL=${SUPPORT_URL:-}
      - HOST_STAGING_ROOT=/tmp/codepost-staging
      - WORKER_STAGING_ROOT=/staging
      - HOST_DATASET_ROOT=${HOST_DATASET_ROOT:-/mnt/datasets}
      - WORKER_DATASET_ROOT=/assignment_datasets
      - WORKER_SHELL_REDIS_URL=redis://redis:6379
      - WORKER_SHELL_SHARED_SECRET=${WORKER_SHELL_SHARED_SECRET}
    volumes:
      # Host bind mounts (not named volumes): the autograder spawns sibling
      # containers that re-mount these paths from the host, so the host path
      # must match HOST_DATASET_ROOT / HOST_STAGING_ROOT.
      - ${HOST_DATASET_ROOT:-/mnt/datasets}:/assignment_datasets
      - /tmp/codepost-staging:/staging
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health-check"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── UI (React SPA) ────────────────────────────────────────────────
  ui:
    container_name: codepost-ui
    build:
      context: ../codePost-ui
      dockerfile: Dockerfile
    environment:
      - REACT_APP_API_URL=${API_URL}
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME:-localhost}
      - CSP_FRAME_ANCESTORS=${CSP_FRAME_ANCESTORS:-}
    volumes:
      - ./certs:/etc/ssl/certs:ro
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8081/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Database (MariaDB) ─────────────────────────────────────────────
  database:
    image: mariadb:latest
    container_name: codepost-database
    environment:
      - MARIADB_ROOT_PASSWORD=${ROOT_DATABASE_PASSWORD}
      - MARIADB_DATABASE=${DB_NAME:-codepost}
      - MARIADB_USER=${DB_USERNAME:-codepost_user}
      - MARIADB_PASSWORD=${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    command:
      - --innodb_page_size=16k
      - --innodb_buffer_pool_size=${INNODB_BUFFER_POOL_SIZE:-1G}
      - --innodb_log_file_size=256M
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=${DB_MAX_CONNECTIONS:-500}
      - --wait_timeout=600
      - --interactive_timeout=3600
    healthcheck:
      test:
        [
          "CMD",
          "mariadb-admin",
          "ping",
          "-h",
          "localhost",
          "--silent",
          "--user=root",
          "--password=${ROOT_DATABASE_PASSWORD}",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Redis ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: codepost-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Celery Worker (Autograder) ────────────────────────────────────
  worker:
    container_name: codepost-worker
    privileged: true
    build:
      context: ../codePost-api
      target: worker
    env_file:
      - .env
    environment:
      - DEBUG=False
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-4}
      - CELERY_BROKER_URL=redis://redis:6379
      - API_URL=${API_URL}
      - CLIENT_URL=${CLIENT_URL}
      - DB_NAME=${DB_NAME:-codepost}
      - DB_HOSTNAME=database
      - DB_PORT=3306
      - DB_USERNAME=${DB_USERNAME:-codepost_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - API_USER=${API_USER}
      - API_PASSWORD=${API_PASSWORD}
      - EMAIL_HOST=${EMAIL_HOST:-localhost}
      - DEFAULT_EMAIL_FROM=${DEFAULT_EMAIL_FROM:-no-reply@localhost}
      - HOST_STAGING_ROOT=/tmp/codepost-staging
      - WORKER_STAGING_ROOT=/staging
      - HOST_DATASET_ROOT=${HOST_DATASET_ROOT:-/mnt/datasets}
      - WORKER_DATASET_ROOT=/assignment_datasets
      - WORKER_SHELL_SHARED_SECRET=${WORKER_SHELL_SHARED_SECRET}
    volumes:
      # Host bind mounts (not named volumes): the autograder spawns sibling
      # containers that re-mount these paths from the host, so the host path
      # must match HOST_DATASET_ROOT / HOST_STAGING_ROOT.
      - ${HOST_DATASET_ROOT:-/mnt/datasets}:/assignment_datasets
      - /tmp/codepost-staging:/staging
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "--app", "autograder", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Celery Beat (Scheduler) ───────────────────────────────────────
  # Fires the periodic tasks in CELERY_BEAT_SCHEDULE: scheduled assignment
  # publishing (publishAt), quiz attempt finalization, scheduled quiz question
  # generation, and course expiry. EXACTLY ONE beat instance may run per
  # deployment — never scale this service.
  beat:
    container_name: codepost-beat
    build:
      context: ../codePost-api
      target: worker
    env_file:
      - .env
    environment:
      - DEBUG=False
      - CELERY_BROKER_URL=redis://redis:6379
      - API_URL=${API_URL}
      - CLIENT_URL=${CLIENT_URL}
      - DB_NAME=${DB_NAME:-codepost}
      - DB_HOSTNAME=database
      - DB_PORT=3306
      - DB_USERNAME=${DB_USERNAME:-codepost_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
    command: ["sh", "-c", "celery --app autograder beat --loglevel info --schedule /tmp/celerybeat-schedule"]
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Worker Shell Relay (Interactive Terminal) ─────────────────────
  worker-shell:
    container_name: codepost-worker-shell
    privileged: true
    build:
      context: ../codePost-api
      target: worker
    command: ["python", "-m", "autograder.worker_shell_relay"]
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DB_NAME=${DB_NAME:-codepost}
      - DB_HOSTNAME=database
      - DB_PORT=3306
      - DB_USERNAME=${DB_USERNAME:-codepost_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - HOST_STAGING_ROOT=/tmp/codepost-staging
      - WORKER_STAGING_ROOT=/staging
      - HOST_DATASET_ROOT=${HOST_DATASET_ROOT:-/mnt/datasets}
      - WORKER_DATASET_ROOT=/assignment_datasets
      - WORKER_SHELL_SHARED_SECRET=${WORKER_SHELL_SHARED_SECRET}
      - WORKER_SHELL_REDIS_URL=redis://redis:6379
      - WORKER_SHELL_WORKER_ID=${WORKER_SHELL_WORKER_ID:-worker-1}
    volumes:
      # Host bind mounts (not named volumes): the autograder spawns sibling
      # containers that re-mount these paths from the host, so the host path
      # must match HOST_DATASET_ROOT / HOST_STAGING_ROOT.
      - ${HOST_DATASET_ROOT:-/mnt/datasets}:/assignment_datasets
      - /tmp/codepost-staging:/staging
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Flower (Celery Monitoring) — Optional ─────────────────────────
  flower:
    container_name: codepost-flower
    build:
      context: ../codePost-api
      target: flower
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379
      - FLOWER_BASIC_AUTH=${API_USER}:${API_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -f -u "$$FLOWER_BASIC_AUTH" http://localhost:5555/ || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    profiles:
      - monitoring
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Autoheal ─────────────────────────────────────────────────────
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: codepost-autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Certbot (Let's Encrypt) — Optional ───────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: codepost-certbot
    volumes:
      - ./certs:/etc/letsencrypt:rw
      - certbot-webroot:/var/www/certbot:rw
    profiles:
      - certbot
    entrypoint:
      "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h &
      wait $${!}; done'"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ─── Volumes ─────────────────────────────────────────────────────────
volumes:
  db-data:
    name: codepost-db-data
    driver: local
  redis-data:
    name: codepost-redis-data
    driver: local
  certbot-webroot:
    name: codepost-certbot-webroot
    driver: local

# ─── Network ─────────────────────────────────────────────────────────
networks:
  default:
    name: codepost-network
    driver: bridge
